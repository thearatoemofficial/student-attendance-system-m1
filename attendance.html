<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System - Attendance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Student Attendance System</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a class="active" href="attendance.html">Attendance</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Attendance Form</h1>
        <p class="page-description">
            Upload a student photo and complete the form to save attendance.
        </p>

        <form id="attendanceForm">
            <div class="form-group">
                <label for="studentPhoto">Student Photo</label>
                <input type="file" id="studentPhoto" accept="image/*">
                <small>Please upload a student image.</small>
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" placeholder="Example: ST001">
            </div>

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter student name">
            </div>

            <div class="form-group">
                <label for="studentClass">Class</label>
                <input type="text" id="studentClass" placeholder="Example: Web Development">
            </div>

            <div class="form-group">
                <label for="attendanceDate">Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <div class="form-group">
                <label for="attendanceStatus">Status</label>
                <select id="attendanceStatus">
                    <option value="">Select status</option>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>
                </select>
            </div>

            <button type="submit" class="btn">Save Attendance</button>
        </form>

        <div class="section-header">
            <h2>Student Attendance List</h2>
            <button id="clearAttendanceBtn" class="btn danger-btn">Clear All</button>
        </div>

        <div id="attendanceCardGrid" class="attendance-card-grid">
            <!-- JavaScript will add student cards here -->
        </div>

        <p id="emptyMessage" class="empty-message">No student attendance records yet.</p>
    </main>

    <footer>
        <p>&copy; 2026 Student Attendance System</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
