<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System - Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Student Attendance System</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="attendance.html">Attendance</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a class="active" href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Contact Us</h1>

        <p class="page-description">
            Send us a message if you have questions about the Student Attendance System.
        </p>

        <form id="contactForm">
            <div class="form-group">
                <label for="contactName">Name</label>
                <input type="text" id="contactName" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="contactEmail">Email</label>
                <input type="email" id="contactEmail" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" placeholder="Enter your message"></textarea>
            </div>

            <button type="submit" class="btn">Send Message</button>
        </form>

        <p id="contactResult" class="success-message"></p>
    </main>

    <footer>
        <p>&copy; 2026 Student Attendance System</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
